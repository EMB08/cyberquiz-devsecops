
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>CyberQuiz | Desafio Hacker</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">🛡️ CYBER<span>QUIZ</span></div>
      <p>DESAFIO DE CIBERSEGURANÇA</p>
    </header>

    <section id="start-screen" class="card">
      <div class="terminal">root@cyberquiz:~# iniciar_desafio</div>
      <h1>Você está pronto para o desafio?</h1>
      <p>Teste seus conhecimentos em DevSecOps,
         segurança e tecnologia.</p>
      <button id="start-btn">INICIAR DESAFIO →</button>
    </section>

    <section id="game-screen" class="card hidden">
      <div class="game-info">
        <span id="progress-text">Pergunta 1/5</span>
        <span id="score">Pontos: 0</span>
      </div>

      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>

      <h2 id="question"></h2>
      <div id="options" class="options"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <button id="next-btn" class="hidden">
        PRÓXIMA PERGUNTA →
      </button>
    </section>

    <section id="result-screen" class="card hidden">
      <h1>DESAFIO CONCLUÍDO!</h1>
      <div id="final-score"></div>
      <p id="result-message"></p>
      <button id="restart-btn">JOGAR NOVAMENTE</button>
    </section>

    <footer>
      FIAP • DEVSECOPS • CYBERQUIZ
    </footer>
  </main>
</body>
</html>
