name: CyberQuiz DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: "01 - Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Analisar historico Git
        run: |
          gitleaks git . \
            --redact \
            --report-format json \
            --report-path gitleaks.json \
            --exit-code 1

      - name: Publicar relatorio Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-01-gitleaks
          path: gitleaks.json
          if-no-files-found: warn
  
  sast:
    name: "02 - Semgrep SAST"
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Instalar Semgrep
        run: |
          python -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Analisar codigo com Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --json \
            --output semgrep.json \
            --error \
            .

      - name: Publicar relatorio Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-02-semgrep
          path: semgrep.json
          if-no-files-found: warn
  build:
    name: "03 - Build e Testes"
    runs-on: ubuntu-24.04
    needs: sast

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar arvore de dependencias
        if: always()
        run: npm ls --all > arvore-dependencias.txt 2>&1 || true

      - name: Executar npm audit informativo
        if: always()
        run: |
          npm audit --json > npm-audit.json || true

      - name: Publicar relatorio do build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-03-build
          path: |
            arvore-dependencias.txt
            npm-audit.json
          if-no-files-found: warn

      - name: Publicar aplicacao
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyberquiz-${{ github.sha }}
          path: |
            src/
            package.json
            package-lock.json
            Dockerfile
            .dockerignore
          if-no-files-found: error

  sca:
    name: "04 - Trivy SCA"
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Instalar Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Gerar relatorio completo
        shell: bash
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --format table \
            --output trivy-sca-completo.txt \
            --exit-code 0

      - name: Analisar vulnerabilidades HIGH e CRITICAL
        shell: bash
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-sca-high-critical.json \
            --exit-code 1

      - name: Publicar relatorios Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-04-trivy-sca
          path: |
            trivy-sca-completo.txt
            trivy-sca-high-critical.json
          if-no-files-found: warn

  docker-build:
    name: "05 - Docker Build e GHCR"
    runs-on: ubuntu-24.04
    needs: sca

    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_digest: ${{ steps.push.outputs.digest }}

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Preparar nome da imagem
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Autenticar no GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Registrar imagem publicada
        if: success()
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "# Docker Build - CyberQuiz"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Tag: $IMAGE_TAG"
            echo "Digest: $IMAGE_DIGEST"
            echo "Referencia imutavel: $IMAGE_NAME@$IMAGE_DIGEST"
          } > docker-build.md

      - name: Publicar relatorio Docker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-05-docker-build
          path: docker-build.md
          if-no-files-found: warn

      - name: Registrar falha do build
        if: failure()
        shell: bash
        run: |
          {
            echo "# Docker Build - CyberQuiz"
            echo
            echo "Status: falha"
            echo "Commit: $GITHUB_SHA"
            echo "Consulte os logs do job docker-build."
          } > docker-build.md

  image-scan:
    name: "06 - Trivy Image Scan"
    runs-on: ubuntu-24.04
    needs: docker-build

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_NAME: ${{ needs.docker-build.outputs.image_name }}
      IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}

    steps:
      - name: Instalar Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Autenticar no GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      - name: Baixar imagem publicada
        shell: bash
        run: |
          set -euo pipefail

          test -n "$IMAGE_NAME"
          test -n "$IMAGE_DIGEST"

          IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          echo "Imagem analisada: $IMAGE_REF"
          docker pull "$IMAGE_REF"

      - name: Gerar relatorio completo da imagem
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          trivy image "$IMAGE_REF" \
            --image-src docker \
            --scanners vuln \
            --format table \
            --output trivy-image-completo.txt \
            --exit-code 0

      - name: Bloquear vulnerabilidades corrigiveis HIGH e CRITICAL
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          trivy image "$IMAGE_REF" \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-image-high-critical.json \
            --exit-code 1

      - name: Registrar referencia da imagem
        if: always()
        shell: bash
        run: |
          {
            echo "# Trivy Image Scan - CyberQuiz"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Imagem: $IMAGE_NAME"
            echo "Digest: $IMAGE_DIGEST"
            echo "Referencia: $IMAGE_NAME@$IMAGE_DIGEST"
          } > trivy-image-referencia.md

      - name: Publicar relatorios da imagem
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-06-trivy-image
          path: |
            trivy-image-completo.txt
            trivy-image-high-critical.json
            trivy-image-referencia.md
          if-no-files-found: warn


  dast-staging:
    name: "07 - DAST em Homologacao"
    needs: image-scan
    runs-on: ubuntu-24.04

    if: github.event_name != 'pull_request'

    environment:
      name: homologacao

    permissions:
      contents: read

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Iniciar CyberQuiz em homologacao
        shell: bash
        run: |
          set -euo pipefail

          NODE_ENV=production PORT=3000 \
            node src/server.js > cyberquiz-staging.log 2>&1 &

          echo $! > cyberquiz-staging.pid

          for tentativa in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/health > /dev/null; then
              echo "CyberQuiz disponivel em homologacao."
              exit 0
            fi

            sleep 2
          done

          echo "ERRO: CyberQuiz nao iniciou."
          cat cyberquiz-staging.log
          exit 1

      - name: Descobrir endereco do host Docker
        id: docker-host
        shell: bash
        run: |
          set -euo pipefail

          HOST_IP="$(docker network inspect bridge \
            --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}')"

          test -n "$HOST_IP"
          echo "ip=$HOST_IP" >> "$GITHUB_OUTPUT"
          echo "Endereco Docker encontrado: $HOST_IP"

      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://${{ steps.docker-host.outputs.ip }}:3000'
          fail_action: false
          allow_issue_writing: false
          artifact_name: relatorio-07-zap-baseline

      - name: Guardar log da aplicacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-07-homologacao-log
          path: cyberquiz-staging.log
          if-no-files-found: warn

  deploy-prod:
    name: "08 - Deploy em Producao"
    runs-on: ubuntu-24.04

    needs:
      - docker-build
      - image-scan
      - dast-staging

    if: github.event_name != 'pull_request'

    environment:
      name: producao
      url: ${{ vars.RENDER_PRODUCTION_URL }}

    permissions:
      contents: read

    timeout-minutes: 20

    concurrency:
      group: cyberquiz-producao
      cancel-in-progress: false

    env:
      IMAGE_NAME: ${{ needs.docker-build.outputs.image_name }}
      IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      PRODUCTION_URL: ${{ vars.RENDER_PRODUCTION_URL }}

    steps:
      - name: Preparar referencia imutavel
        id: image
        shell: bash
        run: |
          set -euo pipefail

          test -n "$IMAGE_NAME"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Imagem aprovada: $IMAGE_REF"

      - name: Solicitar deploy ao Render
        id: deploy
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOOK"

          HTTP_CODE="$(curl --silent --show-error \
            --get \
            --data-urlencode "imgURL=$IMAGE_REF" \
            --output render-deploy-response.json \
            --write-out '%{http_code}' \
            --max-time 60 \
            "$DEPLOY_HOOK")"

          echo "HTTP do Render: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Render nao iniciou o deploy (HTTP $HTTP_CODE)."
            exit 1
          fi

          DEPLOY_ID="$(jq -r '.deploy.id // empty' \
            render-deploy-response.json)"

          if [[ ! "$DEPLOY_ID" =~ ^dep-[a-zA-Z0-9]+$ ]]; then
            echo "::error::Render nao retornou um Deploy ID valido."
            exit 1
          fi

          echo "id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy solicitado: $DEPLOY_ID"

      - name: Aguardar conclusao do deploy
        id: wait
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"

          API_URL="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID"

          for tentativa in $(seq 1 40); do
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-delay 2 \
              --max-time 30 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "$API_URL" \
              --output render-deploy-status.json

            STATUS="$(jq -r '.status // empty' \
              render-deploy-status.json)"

            echo "Tentativa $tentativa/40: $STATUS"

            case "$STATUS" in
              live)
                ACTUAL_IMAGE="$(jq -r '.image.ref // empty' \
                  render-deploy-status.json)"

                if [[ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]]; then
                  echo "::error::A imagem implantada nao corresponde ao digest aprovado."
                  echo "Esperada: $EXPECTED_IMAGE"
                  echo "Informada pelo Render: $ACTUAL_IMAGE"
                  exit 1
                fi

                echo "status=live" >> "$GITHUB_OUTPUT"
                echo "Deploy concluido com a imagem correta."
                exit 0
                ;;

              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy terminou com status: $STATUS"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Tempo limite aguardando o Render."
          exit 1

      - name: Verificar saude em producao
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="${PRODUCTION_URL%/}/health"

          for tentativa in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 30 \
              "$HEALTH_URL" \
              --output production-health.json; then

              if jq -e \
                '.status == "ok" and .application == "CyberQuiz"' \
                production-health.json > /dev/null; then
                echo "Health check aprovado."
                cat production-health.json
                exit 0
              fi
            fi

            echo "Tentativa $tentativa/12: aguardando..."
            sleep 10
          done

          echo "::error::Health check de producao falhou."
          exit 1

      - name: Gerar relatorio de producao
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          DEPLOY_STATUS: ${{ steps.wait.outputs.status }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# Deploy em Producao - CyberQuiz"
            echo
            echo "Resultado do job: $JOB_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo "Imagem: ${IMAGE_REF:-nao_disponivel}"
            echo "Deploy ID: ${DEPLOY_ID:-nao_disponivel}"
            echo "Status Render: ${DEPLOY_STATUS:-nao_confirmado}"
            echo "URL: $PRODUCTION_URL"
            echo "Health check: ${PRODUCTION_URL%/}/health"
          } > relatorio-08-producao.md

          cat relatorio-08-producao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorio de producao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-08-producao
          path: |
            relatorio-08-producao.md
            production-health.json
          if-no-files-found: warn
